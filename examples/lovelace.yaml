- title: История и ограничения
  path: details
  icon: mdi:history
  cards:
  - type: markdown
    content: '## Что проверяет прототип

      - Политика и фактически назначенный VPN показаны отдельно.

      - Выбор в одной секции не меняет ручные политики других.

      - Auto выбирает из кандидатов своей секции; выключение глобальной автоматики
      сохраняет назначения.

      - История решений находится в атрибутах сущности «Последние события».


      Проверки реального выхода, отсутствие утечек и транзакции настоящего Podkop
      ещё требуют нативного OpenWrt-контроллера и отдельного стенда.'
  - type: entities
    title: Службы и история
    entities:
    - entity: sensor.openwrt_vpn_controller_podkop_status
      name: Podkop (смоделирован)
    - entity: sensor.openwrt_vpn_controller_sing_box_status
      name: sing-box (смоделирован)
    - entity: sensor.openwrt_vpn_controller_recent_events
      name: Последние события — нажмите для атрибутов
