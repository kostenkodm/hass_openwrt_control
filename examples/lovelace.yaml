title: OpenWrt VPN
views:
- title: Управление
  path: vpn
  icon: mdi:vpn
  cards:
  - type: markdown
    content: '## OpenWrt VPN — интеграция Home Assistant

      **Тестовый стенд.** Сущности и управление работают через настоящую интеграцию
      HA; роутер, проверки VPN и применение Podkop заменены локальным HTTPS ubus-симулятором.


      **С чего начать:** в карточке **main** выберите `vpn_b`. В режиме наблюдения
      изменится заданная политика и предлагаемый VPN; применённый останется `vpn_a`.
      Карточки **media** и **custom** не должны измениться.


      Для применения в симуляторе: **[Настройки интеграции](/config/integrations/integration/openwrt_vpn)**
      → Настроить → Общие параметры → режим `control`. Затем снова выберите VPN либо
      `Auto`. Для Auto также включите автоматику.


      `inbound_vpn` защищён и отсутствует в списке исходящих VPN. Секции media/custom
      приведены для проверки независимости и не обнаружены на реальном роутере.'
